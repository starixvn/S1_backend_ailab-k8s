apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    CapacityProvisioned: 0.25vCPU 1GB
  name: bonusservice-deployment  
  labels:
    app: bonusservice
spec:
  replicas: 1
  selector:
    matchLabels:
      app: bonusservice  
  template:
    metadata:
      labels:
        app: bonusservice      
    spec:
      containers:
        - name: bonusservice
          image: harbor.ailabpte.co/bonusservice/bonusservice:fa601cb
          ports:
            - containerPort: 50997
          env:
            - name: ASPNETCORE_ENVIRONMENT
              valueFrom:
                configMapKeyRef:
                  name: bonusservice-configmap
                  key: environment
            - name: ServiceType
              value: API
          volumeMounts:
            - name: bonusservice-appsettings
              mountPath: /app/appsettings.Development.json
              subPath: appsettings.Development.json
          livenessProbe:
            httpGet:
              path: /health
              port: 50997
      volumes:
        - name: bonusservice-appsettings
          configMap:
            name: bonusservice-configmap
            items:
              - key: appsettings.Development
                path: appsettings.Development.json
      imagePullSecrets:
        - name: harbor-secret
