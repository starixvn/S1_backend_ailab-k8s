apiVersion: apps/v1
kind: Deployment
metadata:
  name: bonusservice-deployment  
  labels:
    app: bonusservice
    ENV: DEV
spec:
  replicas: 3
  selector:
    matchLabels:
      app: bonusservice
  revisionHistoryLimit: 5
  template:
    metadata:
      labels:
        app: bonusservice
        ENV: DEV
    spec:
      containers:
        - name: bonusservice
          image: harbor.ailabpte.co/bonusservice/bonusservice:21f28a7
          resources:
            requests:
              cpu: "0.5"
              memory: "1G"
            limits:
              cpu: "1"
              memory: "2G"
          ports:
            - containerPort: 50997
          env:
            - name: ASPNETCORE_ENVIRONMENT
              value: Development
            - name: ServiceType
              value: API
            - name: Brand
              value: Nova
          volumeMounts:         
            - name: bonusservice-pvc
              mountPath: /bonus
              subPath: logs/bonus
          livenessProbe:
            httpGet:
              path: /health
              port: 50997
      volumes:        
        - name: bonusservice-pvc
          persistentVolumeClaim:
            claimName: bonusservice-pvc
      imagePullSecrets:
        - name: harbor-secret