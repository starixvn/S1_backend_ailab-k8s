apiVersion: apps/v1
kind: Deployment
metadata:
  name: bonusservice-deployment  
  labels:
    app: bonusservice
spec:
  replicas: 3
  selector:
    matchLabels:
      app: bonusservice
  revisionHistoryLimit: 5
  template:
    metadata:
      labels:
        app: bonusservice      
    spec:
      containers:
        - name: bonusservice
          image: harbor.ailabpte.co/bonusservice/bonusservice:21f28a7
          resources:
            requests:
              cpu: "4"
              memory: "12G"
            limits:
              cpu: "4"
              memory: "24G"
          ports:
            - containerPort: 50997
          env:
            - name: ASPNETCORE_ENVIRONMENT
              valueFrom:
                configMapKeyRef:
                  name: bonusservice-configmap
                  key: environment
            - name: ServiceType
              value: API
          volumeMounts:
            - name: bonusservice-appsettings
              mountPath: /app/appsettings.Development.json
              subPath: appsettings.Development.json
          livenessProbe:
            httpGet:
              path: /health
              port: 50997
      volumes:
        - name: bonusservice-appsettings
          configMap:
            name: bonusservice-configmap
            items:
              - key: appsettings.Development
                path: appsettings.Development.json
      imagePullSecrets:
        - name: harbor-secret