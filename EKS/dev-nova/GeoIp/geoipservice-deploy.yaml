apiVersion: apps/v1
kind: Deployment
metadata:
  name: geoipservice-deployment  
  labels:
    app: geoipservice
    ENV: DEV
spec:
  replicas: 1
  selector:
    matchLabels:
      app: geoipservice
  revisionHistoryLimit: 5
  template:
    metadata:
      labels:
        app: geoipservice      
    spec:
      containers:
        - name: geoipservice
          image: harbor.ailabpte.co/geoip/geoip:3b2db6d
          resources:
            requests:
              cpu: "0.25"
              memory: "1G"
            limits:
              cpu: "0.5"
              memory: "2G" 
          ports:
            - containerPort: 55688
          env:
            - name: ASPNETCORE_ENVIRONMENT
              valueFrom:
                configMapKeyRef:
                  name: geoipservice-configmap
                  key: environment
            - name: ServiceType
              value: API
            - name: Brand
              value: Nova
          volumeMounts:
            - name: geoipservice-appsettings
              mountPath: /app/appsettings.Development.json
              subPath: appsettings.Development.json
            - name: geoipservice-pvc
              mountPath: /geoip
              subPath: logs/geoip
          livenessProbe:
            httpGet:
              path: /health
              port: 55688
      volumes:
        - name: geoipservice-appsettings
          configMap:
            name: geoipservice-configmap
            items:
              - key: appsettings.Development
                path: appsettings.Development.json
        - name: geoipservice-pvc
          persistentVolumeClaim:
            claimName: geoipservice-pvc
      imagePullSecrets:
        - name: harbor-secret