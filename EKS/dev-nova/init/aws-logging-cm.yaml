kind: ConfigMap
apiVersion: v1
metadata:
  name: aws-logging
  namespace: aws-observability
data:
  flb_log_cw: "true"
  output.conf: |
    [OUTPUT]
        Name cloudwatch_logs
        Match kube.var.log.containers.*
        region ap-southeast-1
        log_group_name eks/nova88dev
        log_stream_prefix eks/nova88dev/
        auto_create_group true
        log_key log
                
    [OUTPUT]
        Name es
        Match kube.var.log.containers.paymentservice-*
        Host 172.31.48.203
        Port 9200
        HTTP_User elastic
        HTTP_Passwd #WpF&@$h2J8Y6LH5
        AWS_Region ap-southeast-1        
        Type _doc
        Logstash_Format On
        Logstash_Prefix dev-payment

    [OUTPUT]
        Name es
        Match kube.var.log.containers.paymentworker-*
        Host 172.31.48.203
        Port 9200
        HTTP_User elastic
        HTTP_Passwd #WpF&@$h2J8Y6LH5
        AWS_Region ap-southeast-1        
        Type _doc
        Logstash_Format On
        Logstash_Prefix dev-payment

    [OUTPUT]
        Name es
        Match kube.var.log.containers.adminsite-*
        Host 172.31.48.203
        Port 9200
        HTTP_User elastic
        HTTP_Passwd #WpF&@$h2J8Y6LH5
        AWS_Region ap-southeast-1        
        Type _doc
        Logstash_Format On
        Logstash_Prefix dev-backend
        
    [OUTPUT]
        Name es
        Match kube.var.log.containers.bonusservice-*
        Host 172.31.48.203
        Port 9200
        HTTP_User elastic
        HTTP_Passwd #WpF&@$h2J8Y6LH5
        AWS_Region ap-southeast-1        
        Type _doc
        Logstash_Format On
        Logstash_Prefix dev-bonus

    [OUTPUT]
        Name es
        Match kube.var.log.containers.bonusworker-*
        Host 172.31.48.203
        Port 9200
        HTTP_User elastic
        HTTP_Passwd #WpF&@$h2J8Y6LH5
        AWS_Region ap-southeast-1        
        Type _doc
        Logstash_Format On
        Logstash_Prefix dev-bonus

    [OUTPUT]
        Name es
        Match kube.var.log.containers.commonservice-*
        Host 172.31.48.203
        Port 9200
        HTTP_User elastic
        HTTP_Passwd #WpF&@$h2J8Y6LH5
        AWS_Region ap-southeast-1
        Type _doc
        Logstash_Format On
        Logstash_Prefix dev-common   

    [OUTPUT]
        Name es
        Match kube.var.log.containers.geoipservice-*
        Host 172.31.48.203
        Port 9200
        HTTP_User elastic
        HTTP_Passwd #WpF&@$h2J8Y6LH5
        AWS_Region ap-southeast-1
        Type _doc
        Logstash_Format On
        Logstash_Prefix dev-geoip   

  parsers.conf: |
    [PARSER]
        Name crio
        Format Regex
        Regex ^(?<time>[^ ]+) (?<stream>stdout|stderr) (?<logtag>P|F) (?<log>.*)$
        Time_Key    time
        Time_Format %Y-%m-%dT%H:%M:%S.%L%z

    [PARSER]
        Name json
        Format json
        Time_Key time
        Regex ^(?<time>[^ ]+) (?<stream>stdout|stderr) (?<logtag>P|F) (?<log>.*)$
        Time_Format %Y-%m-%dT%H:%M:%S.%L%z
        Time_Keep On   
  
  filters.conf: |
     [FILTER]
        Name parser
        Match *
        Key_name log
        Parser crio

     [FILTER]
        Name parser
        Match *
        Key_name log
        Parser json
        