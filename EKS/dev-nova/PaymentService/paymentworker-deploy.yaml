apiVersion: apps/v1
kind: Deployment
metadata:
  name: paymentservice-worker-deployment  
  labels:
    app: paymentworker
    ENV: DEV
spec:
  replicas: 1
  selector:
    matchLabels:
      app: paymentworker  
  revisionHistoryLimit: 5
  template:
    metadata:
      labels:
        app: paymentworker
        ENV: DEV
    spec:
      containers:
        - name: paymentworker
          image: harbor.ailabpte.co/paymentservice/paymentservice:6bbc3b5
          resources:
            requests:
              cpu: "0.25"
              memory: "0.5G"
            limits:
              cpu: "0.5"
              memory: "1G" 
          env:
            - name: ASPNETCORE_ENVIRONMENT
              value: Development
            - name: ServiceType
              value: Worker
            - name: Brand
              value: Nova
          volumeMounts:           
            - name: paymentservice-pvc
              mountPath: /payment
              subPath: logs/paymentWorker
      volumes:       
        - name: paymentservice-pvc
          persistentVolumeClaim:
            claimName: paymentservice-pvc
      imagePullSecrets:
        - name: harbor-secret