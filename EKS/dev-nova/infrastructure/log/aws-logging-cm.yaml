kind: ConfigMap
apiVersion: v1
metadata:
  name: aws-logging
  namespace: aws-observability
data:
  flb_log_cw: "false"
  output.conf: |                       
    [OUTPUT]
        Name es
        Match *.nova-desktop-deployment-*.log
        Host 172.31.48.203
        Port 9200
        HTTP_User elastic
        HTTP_Passwd #WpF&@$h2J8Y6LH5
        Type _doc
        Logstash_Format On
        Logstash_Prefix dev-nova-desktop

  parsers.conf: |    
    [PARSER]
        Name crio
        Format Regex
        Regex ^(?<time>[^ ]+) (?<stream>stdout|stderr) (?<logtag>P|F) (?<log>.*)$
        Time_Key    time
        Time_Format %Y-%m-%dT%H:%M:%S.%L%z

    [PARSER]
        Name json
        Format json
        Time_Key time
        Regex ^(?<time>[^ ]+) (?<stream>stdout|stderr) (?<logtag>P|F) (?<log>.*)$
        Time_Format %Y-%m-%dT%H:%M:%S.%L%z
        Time_Keep On   
  
  filters.conf: |    
     [FILTER]
        Name parser
        Match *
        Key_name log
        Parser crio    

     [FILTER]
        Name parser
        Match *
        Key_name log
        Parser json
        