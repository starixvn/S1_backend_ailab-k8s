apiVersion: apps/v1
kind: Deployment
metadata:
  name: thirdpartybethistory-deployment  
  labels:
    app: thirdpartybethistory
    ENV: DEV
spec:
  replicas: 1
  selector:
    matchLabels:
      app: thirdpartybethistory
  revisionHistoryLimit: 5
  template:
    metadata:
      labels:
        app: thirdpartybethistory
        ENV: DEV
    spec:
      containers:
        - name: thirdpartybethistory
          image: harbor.ailabpte.co/integratedservice/thirdpartybethistory:b2d39eb
          resources:
            requests:
              cpu: "0.5"
              memory: "1.5G"
            limits:
              cpu: "0.5"
              memory: "1.5G"          
          env:
            - name: ASPNETCORE_ENVIRONMENT
              value: Development
            - name: ServiceType
              value: Worker
            - name: Brand
              value: Nova
          volumeMounts:            
            - name: thirdpartybethistory-pvc
              mountPath: /bethistory
              subPath: logs/bethistory
      volumes:
        - name: thirdpartybethistory-pvc
          persistentVolumeClaim:
            claimName: thirdpartybethistory-pvc
      imagePullSecrets:
        - name: harbor-secret
