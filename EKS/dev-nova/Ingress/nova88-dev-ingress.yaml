apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: nova88-dev-ingress
  annotations:
    kubernetes.io/ingress.class: alb
    alb.ingress.kubernetes.io/load-balancer-name: nova88-dev-ingress
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP":80}, {"HTTPS":443}]'
    alb.ingress.kubernetes.io/certificate-arn: 'arn:aws:acm:ap-southeast-1:761771912479:certificate/b2f710d7-f3e9-4d45-9f9b-c764604e9993'
    alb.ingress.kubernetes.io/subnets: subnet-01e7e7bda293d8785,subnet-0d918c212f9ba2a81,subnet-0e3a2c7c694c8601b
spec:
  ingressClassName: alb
  rules:
  - host: config.nova88dev.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: configservice-service
            port:
              number: 80
  - host: adminsite.nova88dev.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: adminsite-service
            port:
              number: 80
  - host: membersite.nova88dev.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: membersite-service
            port:
              number: 80
  - host: membersiteapp.nova88dev.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: membersite-app-service
            port:
              number: 80
  - host: bonusservice.nova88dev.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: bonusservice-service
            port:
              number: 80
  - host: commonservice.nova88dev.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: commonservice-service
            port:
              number: 80
  - host: geoip.nova88dev.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: geoipservice-service
            port:
              number: 80


