apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: adminsite
spec:
  replicas: 1
  selector:
    matchLabels:
      app: adminsite  
  template:
    metadata:
      labels:
        app: adminsite      
    spec:
      containers:
        - name: adminsite
          image: harbor.ailabpte.co/adminsite/backendsite:53bf5c9
          resources:
            requests:
              cpu: "0.25"
              memory: "0.5G"
            limits:
              cpu: "0.25"
              memory: "0.5G" 
          ports:
            - containerPort: 5070
          env:
            - name: ASPNETCORE_ENVIRONMENT
              valueFrom:
                configMapKeyRef:
                  name: adminsite-configmap
                  key: environment
            - name: ServiceType
              value: API
          volumeMounts:
            - name: adminsite-appsettings
              mountPath: /app/appsettings.Development.json
              subPath: appsettings.Development.json
      volumes:
        - name: adminsite-appsettings
          configMap:
            name: adminsite-configmap
            items:
              - key: appsettings.Development
                path: appsettings.Development.json
      imagePullSecrets:
        - name: harbor-secret
