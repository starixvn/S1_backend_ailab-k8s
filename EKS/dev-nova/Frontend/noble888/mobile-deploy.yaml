apiVersion: apps/v1
kind: Deployment
metadata:
  name: noble888-mobile-deployment
  labels:
    app: noble888-mobile
    ENV: DEV
spec:
  replicas: 3
  selector:
    matchLabels:
      app: noble888-mobile
  revisionHistoryLimit: 5
  template:
    metadata:
      labels:
        app: noble888-mobile
        ENV: DEV
    spec:
      containers:
        - name: noble888-mobile
          image: harbor.ailabpte.co/mobile/next-noble888-dev:271a317
          lifecycle:            
            preStop:
              exec:
                command: ["/bin/sh","-c","sleep 70"]
          resources:
            requests:
              cpu: "1"
              memory: "2G"
            limits:
              cpu: "1"
              memory: "3G"
          ports:
            - containerPort: 5074
          readinessProbe:
            httpGet:
              path: /health
              port: 5074
            initialDelaySeconds: 15
      terminationGracePeriodSeconds: 90
      imagePullSecrets:
        - name: harbor-secret
