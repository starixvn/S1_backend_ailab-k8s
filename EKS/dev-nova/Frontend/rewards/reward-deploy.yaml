apiVersion: apps/v1
kind: Deployment
metadata:
  name: reward-deployment  
  labels:
    app: reward
    ENV: DEV
spec:
  replicas: 1
  selector:
    matchLabels:
      app: reward
  revisionHistoryLimit: 5
  template:
    metadata:
      labels:
        app: reward
        ENV: DEV
    spec:
      containers:
        - name: reward
          image: harbor.ailabpte.co/desktop/next-nova88-reward-dev:d1ba39f
          lifecycle:            
            preStop:
              exec:
                command: ["/bin/sh","-c","sleep 70"]
          resources:
            requests:
              cpu: "0.5"
              memory: "1G"
            limits:
              cpu: "1"
              memory: "2G"
          ports:
            - containerPort: 5073
      terminationGracePeriodSeconds: 90
      imagePullSecrets:
        - name: harbor-secret 