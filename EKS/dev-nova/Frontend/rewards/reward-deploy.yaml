apiVersion: apps/v1
kind: Deployment
metadata:
  name: reward-deployment  
  labels:
    app: reward
spec:
  replicas: 1
  selector:
    matchLabels:
      app: reward
  template:
    metadata:
      labels:
        app: reward
    spec:
      containers:
        - name: reward
          image: harbor.ailabpte.co/desktop/next-nova88-reward-dev:d1ba39f
          resources:
            requests:
              cpu: "0.5"
              memory: "1G"
            limits:
              cpu: "1"
              memory: "2G"
          ports:
            - containerPort: 5073
      imagePullSecrets:
        - name: harbor-secret 