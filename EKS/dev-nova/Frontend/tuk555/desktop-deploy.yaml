apiVersion: apps/v1
kind: Deployment
metadata:
  name: tuk555-desktop-deployment  
  labels:
    app: tuk555-desktop
    ENV: DEV
spec:
  replicas: 3
  selector:
    matchLabels:
      app: tuk555-desktop
  revisionHistoryLimit: 5
  template:
    metadata:
      labels:
        app: tuk555-desktop
        ENV: DEV
    spec:
      containers:
        - name: tuk555-desktop
          image: harbor.ailabpte.co/desktop/next-tuk555-dev:45fe7c0
          lifecycle:            
            preStop:
              exec:
                command: ["/bin/sh","-c","sleep 70"]
          resources:
            requests:
              cpu: "1"
              memory: "2G"
            limits:
              cpu: "1"
              memory: "3G"
          ports:
            - containerPort: 5073
          readinessProbe:
            httpGet:
              path: /health
              port: 5073
            initialDelaySeconds: 15
      terminationGracePeriodSeconds: 90
      imagePullSecrets:
        - name: harbor-secret 