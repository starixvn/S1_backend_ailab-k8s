apiVersion: apps/v1
kind: Deployment
metadata:
  name: nova-desktop-deployment  
  labels:
    app: nova-desktop
    ENV: DEV
spec:
  replicas: 3
  selector:
    matchLabels:
      app: nova-desktop
  revisionHistoryLimit: 5
  template:
    metadata:
      labels:
        app: nova-desktop
        ENV: DEV
    spec:
      containers:
        - name: nova-desktop
          image: harbor.ailabpte.co/desktop/next-nova88-dev:b45f906
          lifecycle:            
            preStop:
              exec:
                command: ["/bin/sh","-c","sleep 70"]
          resources:
            requests:
              cpu: "1"
              memory: "2G"
            limits:
              cpu: "1"
              memory: "3G"
          ports:
            - containerPort: 5073
          readinessProbe:
            httpGet:
              path: /health
              port: 5073
            initialDelaySeconds: 15
      terminationGracePeriodSeconds: 90
      imagePullSecrets:
        - name: harbor-secret 