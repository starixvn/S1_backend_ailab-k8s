apiVersion: apps/v1
kind: Deployment
metadata:
  name: nova-desktop-deployment  
  labels:
    app: nova-desktop
    ENV: DEV
spec:
  replicas: 3
  selector:
    matchLabels:
      app: nova-desktop
  template:
    metadata:
      labels:
        app: nova-desktop
        ENV: DEV
    spec:
      containers:
        - name: nova-desktop
          image: harbor.ailabpte.co/desktop/next-nova88-dev:b45f906
          resources:
            requests:
              cpu: "1"
              memory: "2G"
            limits:
              cpu: "1"
              memory: "3G"
          ports:
            - containerPort: 5073
      imagePullSecrets:
        - name: harbor-secret 