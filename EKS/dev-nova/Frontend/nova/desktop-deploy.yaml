apiVersion: apps/v1
kind: Deployment
metadata:
  name: nova-desktop-deployment  
  labels:
    app: nova-desktop
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nova-desktop
  template:
    metadata:
      labels:
        app: nova-desktop
    spec:
      containers:
        - name: nova-desktop
          image: harbor.ailabpte.co/desktop/next-nova88-dev:271a317
          resources:
            requests:
              cpu: "0.5"
              memory: "1G"
            limits:
              cpu: "1"
              memory: "2G"
          ports:
            - containerPort: 5073
      imagePullSecrets:
        - name: harbor-secret 