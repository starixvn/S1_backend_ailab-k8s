apiVersion: apps/v1
kind: Deployment
metadata:
  name: adminweb-deployment  
  labels:
    app: adminweb
    ENV: DEV
spec:
  replicas: 1
  selector:
    matchLabels:
      app: adminweb
  template:
    metadata:
      labels:
        app: adminweb
        ENV: DEV
    spec:
      containers:
        - name: adminweb
          image: harbor.ailabpte.co/desktop/admin-dev:e31d3e9
          resources:
            requests:
              cpu: "0.25"
              memory: "0.5G"
            limits:
              cpu: "0.5"
              memory: "1G" 
          ports:
            - containerPort: 5071
          volumeMounts:
            - name: admin-conf-volume
              mountPath: /etc/nginx/conf.d
      volumes:
        - name: admin-conf-volume
          configMap:
            name: adminweb-configmap
            items:
              - key: key-adminconf
                path: admin.conf
      imagePullSecrets:
        - name: harbor-secret
