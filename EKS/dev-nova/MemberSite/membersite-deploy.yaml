apiVersion: apps/v1
kind: Deployment
metadata:
  name: membersite-deployment
  labels:
    app: membersite
    ENV: DEV
spec:
  replicas: 3
  selector:
    matchLabels:
      app: membersite
  revisionHistoryLimit: 5
  template:
    metadata:
      labels:
        app: membersite
    spec:
      containers:
        - name: membersite
          image: harbor.ailabpte.co/membersite/membersite:1f62855
          resources:
            requests:
              cpu: "0.5"
              memory: "1G"
            limits:
              cpu: "1"
              memory: "2G"
          ports:
            - containerPort: 80
          env:
            - name: ASPNETCORE_ENVIRONMENT
              valueFrom:
                configMapKeyRef:
                  name: membersite-configmap
                  key: environment
            - name: ServiceType
              value: API
            - name: Brand
              value: Nova
          volumeMounts:
            - name: membersite-appsettings
              mountPath: /app/appsettings.Development.json
              subPath: appsettings.Development.json
            - name: membersite-pvc
              mountPath: /membersite
              subPath: logs/membersite
      volumes:
        - name: membersite-appsettings
          configMap:
            name: membersite-configmap
            items:
              - key: appsettings.Development
                path: appsettings.Development.json
        - name: membersite-pvc
          persistentVolumeClaim:
            claimName: membersite-pvc
      imagePullSecrets:
        - name: harbor-secret