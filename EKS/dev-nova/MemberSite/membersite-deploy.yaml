apiVersion: apps/v1
kind: Deployment
metadata:
  name: membersite-deployment
  labels:
    app: membersite
    ENV: DEV
spec:
  replicas: 3
  selector:
    matchLabels:
      app: membersite
  revisionHistoryLimit: 5
  template:
    metadata:
      labels:
        app: membersite
        ENV: DEV
      annotations:
        prometheus.io/port: '80'
        prometheus.io/scrape: 'true'
    spec:
      containers:
        - name: membersite
          image: harbor.ailabpte.co/membersite/membersite:1f62855
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sh","-c","sleep 70"]
          resources:
            requests:
              cpu: "0.5"
              memory: "1G"
            limits:
              cpu: "1"
              memory: "2G"
          ports:
            - containerPort: 80
          env:
            - name: ASPNETCORE_ENVIRONMENT
              value: Development
            - name: ServiceType
              value: API
            - name: Brand
              value: Nova
          volumeMounts:
            - name: membersite-pvc
              mountPath: /membersite
              subPath: logs/membersite
          readinessProbe:
            httpGet:
              path: /health
              port: 80
            initialDelaySeconds: 15
      volumes:       
        - name: membersite-pvc
          persistentVolumeClaim:
            claimName: membersite-pvc
      imagePullSecrets:
        - name: harbor-secret