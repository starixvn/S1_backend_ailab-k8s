apiVersion: apps/v1
kind: Deployment
metadata:
  name: tpservice-deployment  
  labels:
    app: tpservice
    ENV: DEV
spec:
  replicas: 1
  selector:
    matchLabels:
      app: tpservice  
  revisionHistoryLimit: 5
  template:
    metadata:
      labels:
        app: tpservice
        ENV: DEV
    spec:
      containers:
        - name: tpservice
          image: harbor.ailabpte.co/integratedservice/thirdpartyservice:30ab391
          resources:
            requests:
              cpu: "0.25"
              memory: "0.5G"
            limits:
              cpu: "0.5"
              memory: "1G" 
          ports:
            - containerPort: 55996
          env:
            - name: ASPNETCORE_ENVIRONMENT
              value: Development
            - name: ServiceType
              value: API
            - name: Brand
              value: Nova
          volumeMounts:        
            - name: tpservice-pvc
              mountPath: /tpservice
              subPath: logs/tpservice
          livenessProbe:
            httpGet:
              path: /health
              port: 55996
      volumes:     
        - name: tpservice-pvc
          persistentVolumeClaim:
            claimName: tpservice-pvc
      imagePullSecrets:
        - name: harbor-secret
