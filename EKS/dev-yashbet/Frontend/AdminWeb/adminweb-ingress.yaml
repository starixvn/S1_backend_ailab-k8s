apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: dev-adminweb-ingress  
  annotations:
    kubernetes.io/ingress.class: alb
    alb.ingress.kubernetes.io/load-balancer-name: dev-adminweb-ingress 
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip   
    alb.ingress.kubernetes.io/subnets: subnet-09332247c64aff074,subnet-01756b250ebae0fae,subnet-0ea1391c518fe60dc    
spec:
  ingressClassName: alb
  rules:
    - host: "admin.nova88dev.com"
      http:
        paths:
        - path: /
          pathType: Prefix
          backend:
            service:
              name: adminweb-service
              port:
                number: 80