#       # when.not.contains.tags: forwarded
#   # - add_cloud_metadata: ~
#   # - add_docker_metadata: ~
#   # - add_kubernetes_metadata: ~

# ================================== Logging ===================================
logging.level: info
logging.to_files: true
logging.files:
  path: /logs/filebeat
  name: filebeat.log
  keepfiles: 7
  rotateeverybytes: 10485760
