apiVersion: apps/v1
kind: Deployment
metadata:
  name: tpservice-worker-deployment  
  labels:
    app: tpworker
    ENV: DEV
spec:
  replicas: 1
  selector:
    matchLabels:
      app: tpworker  
  template:
    metadata:
      labels:
        app: tpworker
        ENV: DEV
    spec:
      containers:
        - name: tpworker
          image: harbor.ailabpte.co/integratedservice/thirdpartyservice:037eae9
          resources:
            requests:
              cpu: "0.25"
              memory: "0.5G"
            limits:
              cpu: "0.25"
              memory: "0.5G" 
          env:
            - name: ASPNETCORE_ENVIRONMENT
              valueFrom:
                configMapKeyRef:
                  name: tpservice-configmap
                  key: environment
            - name: ServiceType
              value: Worker
            - name: Brand
              value: Nova
          volumeMounts:
            - name: tpworker-appsettings
              mountPath: /app/appsettings.Development.json
              subPath: appsettings.Development.json
            - name: tpservice-pvc
              mountPath: /tpservice
              subPath: logs/tpserviceWorker
      volumes:
        - name: tpworker-appsettings
          configMap:
            name: tpservice-configmap
            items:
              - key: appsettings.Development
                path: appsettings.Development.json
        - name: tpservice-pvc
          persistentVolumeClaim:
            claimName: tpservice-pvc
      imagePullSecrets:
        - name: harbor-secret
