        pathType: Prefix
        backend:
          service:
            name: payservice-service
            port:
              number: 80
  - host: tpservice.myjackfishdev.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: tpservice-service
            port:
