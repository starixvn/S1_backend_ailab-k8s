apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: dev-backend-internal-ingress
  annotations:
    kubernetes.io/ingress.class: alb
    alb.ingress.kubernetes.io/load-balancer-name: dev-backend-internal-ingress
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP":80}, {"HTTPS":443}]'
    alb.ingress.kubernetes.io/certificate-arn: 'arn:aws:acm:ap-southeast-1:989680738601:certificate/e7b32c52-b2e4-444c-b7d4-da0419552dd5'        
    alb.ingress.kubernetes.io/subnets: subnet-0d490330adca16246,subnet-0baa06859306cb38e,subnet-0ad50bdb3cfa68c0d
    alb.ingress.kubernetes.io/healthcheck-path: /health
    alb.ingress.kubernetes.io/load-balancer-attributes: deletion_protection.enabled=true
spec:
  ingressClassName: alb
  rules:
  - host: adminsiteservice.myjackfishdev.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: adminsite-service
            port:
              number: 80
  - host: membersiteservice.myjackfishdev.com
    http:
      paths:
      - path: /
        pathType: Prefix
