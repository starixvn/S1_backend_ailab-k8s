apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: dev-backend-internal-ingress
  annotations:
    kubernetes.io/ingress.class: alb
    alb.ingress.kubernetes.io/load-balancer-name: dev-backend-internal-ingress
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP":80}, {"HTTPS":443}]'
    alb.ingress.kubernetes.io/certificate-arn: 'arn:aws:acm:ap-southeast-1:420163908753:certificate/65761715-9f8a-4ca5-a586-ac68e7d42f74'    
    alb.ingress.kubernetes.io/subnets: subnet-0dd11053ee9d25063,subnet-021afa84bccb5a03d,subnet-086d7ac1d1324cda0
    alb.ingress.kubernetes.io/healthcheck-path: /health
    alb.ingress.kubernetes.io/load-balancer-attributes: deletion_protection.enabled=true
spec:
  ingressClassName: alb
  rules:
  - host: configservice.aiking88dev.net
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: configservice-service
            port:
              number: 80
  - host: adminsiteservice.aiking88dev.net
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: adminsite-service
            port:
              number: 80
