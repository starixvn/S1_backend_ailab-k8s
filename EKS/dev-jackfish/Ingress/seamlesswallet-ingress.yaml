apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: dev-seamlesswallet-ingress
  annotations:
    kubernetes.io/ingress.class: alb
    alb.ingress.kubernetes.io/load-balancer-name: dev-seamlesswallet-ingress  
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP":80}, {"HTTPS":443}]'
    alb.ingress.kubernetes.io/certificate-arn: 'arn:aws:acm:ap-southeast-1:989680738601:certificate/e7b32c52-b2e4-444c-b7d4-da0419552dd5'
    alb.ingress.kubernetes.io/wafv2-acl-arn: arn:aws:wafv2:ap-southeast-1:989680738601:regional/webacl/TP_AccessRule_DEV/2b45e419-408c-48c6-a430-fdfc676f8085                                             
    alb.ingress.kubernetes.io/subnets: subnet-053eb5f01ce07c645,subnet-0598f552bdae3b2ab,subnet-0e191924862679cdf
    alb.ingress.kubernetes.io/healthcheck-path: /health
    alb.ingress.kubernetes.io/load-balancer-attributes: deletion_protection.enabled=true
spec:
  ingressClassName: alb
  rules:
    - host: "tp.myjackfishdev.com"
      http:
        paths:
        - path: /
          pathType: Prefix
          backend:
            service:
              name: seamlesswallet-service
              port:
                number: 443