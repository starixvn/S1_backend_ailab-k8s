apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: dev-payment-ingress
  annotations:
    kubernetes.io/ingress.class: alb
    alb.ingress.kubernetes.io/load-balancer-name: dev-payment-ingress
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP":80}, {"HTTPS":443}]'
    alb.ingress.kubernetes.io/certificate-arn: 'arn:aws:acm:ap-southeast-1:761771912479:certificate/b2f710d7-f3e9-4d45-9f9b-c764604e9993'
    alb.ingress.kubernetes.io/wafv2-acl-arn: arn:aws:wafv2:ap-southeast-1:761771912479:regional/webacl/Payment_Nova_AccessRule_DEV/c211c138-61e0-46d6-b4ca-0a8f23c2dd49
    alb.ingress.kubernetes.io/subnets: subnet-09332247c64aff074,subnet-01756b250ebae0fae,subnet-0ea1391c518fe60dc
    alb.ingress.kubernetes.io/healthcheck-path: /health
    alb.ingress.kubernetes.io/load-balancer-attributes: deletion_protection.enabled=true
spec:
  ingressClassName: alb
  rules:
    - host: "payment.nova88dev.com"
      http:
        paths:
        - path: /
          pathType: Prefix
          backend:
            service:
              name: payservice-service
              port:
                number: 443