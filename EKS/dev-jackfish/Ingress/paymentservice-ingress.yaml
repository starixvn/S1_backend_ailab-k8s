apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: dev-payment-ingress
  annotations:
    kubernetes.io/ingress.class: alb
    alb.ingress.kubernetes.io/load-balancer-name: dev-payment-ingress
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP":80}, {"HTTPS":443}]'
    alb.ingress.kubernetes.io/certificate-arn: 'arn:aws:acm:ap-southeast-1:989680738601:certificate/e7b32c52-b2e4-444c-b7d4-da0419552dd5'
    alb.ingress.kubernetes.io/wafv2-acl-arn: arn:aws:wafv2:ap-southeast-1:989680738601:regional/webacl/Payment_AccessRule_DEV/fb8c3841-211b-4def-bce3-afe000f0f0d1                                             
    alb.ingress.kubernetes.io/subnets: subnet-053eb5f01ce07c645,subnet-0598f552bdae3b2ab,subnet-0e191924862679cdf
    alb.ingress.kubernetes.io/healthcheck-path: /health
    alb.ingress.kubernetes.io/load-balancer-attributes: deletion_protection.enabled=true
spec:
  ingressClassName: alb
  rules:
    - host: "payment.myjackfishdev.com"
      http:
        paths:
        - path: /
          pathType: Prefix
          backend:
            service:
              name: payservice-service
              port:
                number: 443