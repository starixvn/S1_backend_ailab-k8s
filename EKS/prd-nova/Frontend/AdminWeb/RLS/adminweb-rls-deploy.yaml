apiVersion: apps/v1
kind: Deployment
metadata:
  name: adminweb-rls-deployment  
  labels:
    app: adminweb-rls
spec:
  replicas: 2
  selector:
    matchLabels:
      app: adminweb-rls
  template:
    metadata:
      labels:
        app: adminweb-rls
    spec:
      containers:
        - name: adminweb-rls
          image: harbor.ailabpte.co/desktop/admin-rls:c97008e
          resources:
            requests:
              cpu: "0.5"
              memory: "1G"
            limits:
              cpu: "1"
              memory: "2G"
          ports:
            - containerPort: 5071
          volumeMounts:
            - name: admin-conf-volume
              mountPath: /etc/nginx/conf.d
      volumes:
        - name: admin-conf-volume
          configMap:
            name: adminweb-configmap
            items:
              - key: rls-adminconf
                path: admin.conf
      imagePullSecrets:
        - name: harbor-secret
