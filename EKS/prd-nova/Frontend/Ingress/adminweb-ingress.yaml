apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: prd-adminweb-ingress  
  annotations:
    kubernetes.io/ingress.class: alb
    alb.ingress.kubernetes.io/load-balancer-name: prd-adminweb-ingress 
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip   
    alb.ingress.kubernetes.io/subnets: subnet-045d980c50e6dc7b4,subnet-056fe0386b9b46a40,subnet-0bcd9c088afc673e6
spec:
  ingressClassName: alb
  rules:
    - host: "backoffice.ailab88.net"
      http:
        paths:
        - path: /
          pathType: Prefix
          backend:
            service:
              name: adminweb-service
              port:
                number: 80
    - host: "backofficerelease.ailab88.net"
      http:
        paths:
        - path: /
          pathType: Prefix
          backend:
            service:
              name: adminweb-rls-service
              port:
                number: 80