apiVersion: apps/v1
kind: Deployment
metadata:
  name: nova-mobile-deployment
  labels:
    app: nova-mobile
    ENV: PRD
spec:
  replicas: 2
  selector:
    matchLabels:
      app: nova-mobile
  revisionHistoryLimit: 5
  template:
    metadata:
      labels:
        app: nova-mobile
        ENV: PRD
    spec:
      containers:
        - name: nova-mobile
          image: harbor.ailabpte.co/mobile/next-nova88-prd:a7bb4be
          resources:
            requests:
              cpu: "1"
              memory: "2G"
            limits:
              cpu: "1"
              memory: "4G"
          ports:
            - containerPort: 5074
      imagePullSecrets:
        - name: harbor-secret
