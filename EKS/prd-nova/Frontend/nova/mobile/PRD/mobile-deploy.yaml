apiVersion: apps/v1
kind: Deployment
metadata:
  name: nova-mobile-deployment
  labels:
    app: nova-mobile
    ENV: PRD
spec:
  replicas: 2
  selector:
    matchLabels:
      app: nova-mobile
  revisionHistoryLimit: 5
  template:
    metadata:
      labels:
        app: nova-mobile
        ENV: PRD
    spec:
      containers:
        - name: nova-mobile
          image: harbor.ailabpte.co/mobile/next-nova88-prd:a7bb4be
          lifecycle:            
            preStop:
              exec:
                command: ["/bin/sh","-c","sleep 70"]
          resources:
            requests:
              cpu: "8"
              memory: "16G"
            limits:
              cpu: "16"
              memory: "32G"
          ports:
            - containerPort: 5074
          readinessProbe:
            httpGet:
              path: /health
              port: 5074
            initialDelaySeconds: 15
      terminationGracePeriodSeconds: 90
      imagePullSecrets:
        - name: harbor-secret
