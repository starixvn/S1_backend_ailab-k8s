apiVersion: apps/v1
kind: Deployment
metadata:
  name: nova-mobile-rls-deployment
  labels:
    app: nova-rls-mobile
    ENV: PRD
spec:
  replicas: 3
  selector:
    matchLabels:
      app: nova-rls-mobile
  revisionHistoryLimit: 5
  template:
    metadata:
      labels:
        app: nova-rls-mobile
        ENV: PRD
    spec:
      containers:
        - name: nova-rls-mobile
          image: harbor.ailabpte.co/mobile/next-nova88-rls:665719c
          lifecycle:            
            preStop:
              exec:
                command: ["/bin/sh","-c","sleep 70"]
          resources:
            requests:
              cpu: "0.5"
              memory: "1G"
            limits:
              cpu: "1"
              memory: "2G"
          ports:
            - containerPort: 5074
          readinessProbe:
            httpGet:
              path: /health
              port: 5074
            initialDelaySeconds: 15
      terminationGracePeriodSeconds: 90
      imagePullSecrets:
        - name: harbor-secret
