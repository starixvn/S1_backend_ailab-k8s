apiVersion: apps/v1
kind: Deployment
metadata:
  name: nova-mobile-rls-deployment
  labels:
    app: nova-rls-mobile
    ENV: PRD
spec:
  replicas: 3
  selector:
    matchLabels:
      app: nova-rls-mobile
  template:
    metadata:
      labels:
        app: nova-rls-mobile
        ENV: PRD
    spec:
      containers:
        - name: nova-rls-mobile
          image: harbor.ailabpte.co/mobile/next-nova88-rls:665719c
          resources:
            requests:
              cpu: "0.5"
              memory: "1G"
            limits:
              cpu: "1"
              memory: "2G"
          ports:
            - containerPort: 5074
      imagePullSecrets:
        - name: harbor-secret
