apiVersion: apps/v1
kind: Deployment
metadata:
  name: nova-desktop-rls-deployment  
  labels:
    app: nova-rls-desktop
    ENV: PRD
spec:
  replicas: 3
  selector:
    matchLabels:
      app: nova-rls-desktop
  revisionHistoryLimit: 5
  template:
    metadata:
      labels:
        app: nova-rls-desktop
        ENV: PRD
    spec:
      containers:
        - name: nova-rls-desktop
          image: harbor.ailabpte.co/desktop/next-nova88-rls:a6e8ca9
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sh","-c","sleep 70"]
          resources:
            requests:
              cpu: "0.5"
              memory: "1G"
            limits:
              cpu: "1"
              memory: "2G"
          ports:
            - containerPort: 5073
          readinessProbe:
            httpGet:
              path: /health
              port: 5073
            initialDelaySeconds: 15
      terminationGracePeriodSeconds: 90
      imagePullSecrets:
        - name: harbor-secret 