apiVersion: apps/v1
kind: Deployment
metadata:
  name: nova-desktop-deployment  
  labels:
    app: nova-desktop
    ENV: PRD
spec:
  replicas: 2
  selector:
    matchLabels:
      app: nova-desktop
  revisionHistoryLimit: 5
  template:
    metadata:
      labels:
        app: nova-desktop
        ENV: PRD
    spec:
      containers:
        - name: nova-desktop
          image: harbor.ailabpte.co/desktop/next-nova88-prd:a7bb4be
          resources:
            requests:
              cpu: "1"
              memory: "2G"
            limits:
              cpu: "1"
              memory: "4G"
          ports:
            - containerPort: 5073
      imagePullSecrets:
        - name: harbor-secret 