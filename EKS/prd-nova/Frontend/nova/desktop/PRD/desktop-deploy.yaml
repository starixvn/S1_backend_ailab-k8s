apiVersion: apps/v1
kind: Deployment
metadata:
  name: nova-desktop-deployment  
  labels:
    app: nova-desktop
    ENV: PRD
spec:
  replicas: 2
  selector:
    matchLabels:
      app: nova-desktop
  revisionHistoryLimit: 5
  template:
    metadata:
      labels:
        app: nova-desktop
        ENV: PRD
    spec:
      containers:
        - name: nova-desktop
          image: harbor.ailabpte.co/desktop/next-nova88-prd:a7bb4be
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sh","-c","sleep 70"]
          resources:
            requests:
              cpu: "2"
              memory: "16G"
            limits:
              cpu: "4"
              memory: "30G"
          ports:
            - containerPort: 5073
          # readinessProbe:
          #   httpGet:
          #     path: /health
          #     port: 5073
          #   initialDelaySeconds: 15
      terminationGracePeriodSeconds: 90
      imagePullSecrets:
        - name: harbor-secret 