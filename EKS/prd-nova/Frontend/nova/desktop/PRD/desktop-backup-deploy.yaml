apiVersion: apps/v1
kind: Deployment
metadata:
  name: nova-desktop-backup-deployment
  labels:
    app: nova-desktop-backup
    ENV: PRD
spec:
  replicas: 3
  selector:
    matchLabels:
      app: nova-desktop-backup
  revisionHistoryLimit: 5
  template:
    metadata:
      labels:
        app: nova-desktop-backup
        ENV: PRD
    spec:
      containers:
        - name: nova-desktop
          image: harbor.ailabpte.co/desktop/next-nova88-prd:a926640
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sh","-c","sleep 70"]
          resources:
            requests:
              cpu: "8"
              memory: "16G"
            limits:
              cpu: "16"
              memory: "32G"
          ports:
            - containerPort: 5073
          readinessProbe:
            httpGet:
              path: /health
              port: 5073
            initialDelaySeconds: 15
      terminationGracePeriodSeconds: 90
      imagePullSecrets:
        - name: harbor-secret 