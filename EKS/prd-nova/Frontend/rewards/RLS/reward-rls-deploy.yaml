apiVersion: apps/v1
kind: Deployment
metadata:
  name: reward-rls-deployment  
  labels:
    app: reward-rls
spec:
  replicas: 2
  selector:
    matchLabels:
      app: reward-rls
  template:
    metadata:
      labels:
        app: reward-rls
    spec:
      containers:
        - name: reward-rls
          image: harbor.ailabpte.co/desktop/next-nova88-reward-rls:c5265e8
          resources:
            requests:
              cpu: "2"
              memory: "4G"
            limits:
              cpu: "4"
              memory: "8G"
          ports:
            - containerPort: 5073
      imagePullSecrets:
        - name: harbor-secret 