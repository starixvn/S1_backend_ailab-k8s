apiVersion: apps/v1
kind: Deployment
metadata:
  name: reward-rls-deployment  
  labels:
    app: reward-rls
    ENV: PRD
spec:
  replicas: 1
  selector:
    matchLabels:
      app: reward-rls
  revisionHistoryLimit: 5
  template:
    metadata:
      labels:
        app: reward-rls
        ENV: PRD
    spec:
      containers:
        - name: reward-rls
          image: harbor.ailabpte.co/desktop/next-nova88-reward-rls:c5265e8
          lifecycle:            
            preStop:
              exec:
                command: ["/bin/sh","-c","sleep 70"]
          resources:
            requests:
              cpu: "0.5"
              memory: "1G"
            limits:
              cpu: "1"
              memory: "2G"
          ports:
            - containerPort: 5073
      terminationGracePeriodSeconds: 90
      imagePullSecrets:
        - name: harbor-secret 