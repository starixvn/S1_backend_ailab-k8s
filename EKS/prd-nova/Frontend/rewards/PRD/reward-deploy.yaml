apiVersion: apps/v1
kind: Deployment
metadata:
  name: reward-deployment
  labels:
    app: reward
    ENV: PRD
spec:
  replicas: 1
  selector:
    matchLabels:
      app: reward
  revisionHistoryLimit: 5
  template:
    metadata:
      labels:
        app: reward
        ENV: PRD
    spec:
      containers:
        - name: reward
          image: harbor.ailabpte.co/desktop/next-nova88-reward-prd:c5265e8
          lifecycle:            
            preStop:
              exec:
                command: ["/bin/sh","-c","sleep 70"]
          resources:
            requests:
              cpu: "1"
              memory: "2G"
            limits:
              cpu: "1"
              memory: "4G"
          ports:
            - containerPort: 5073
          readinessProbe:
            httpGet:
              path: /health
              port: 5073
            initialDelaySeconds: 15
      terminationGracePeriodSeconds: 90
      imagePullSecrets:
        - name: harbor-secret 