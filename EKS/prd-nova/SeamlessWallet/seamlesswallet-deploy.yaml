apiVersion: apps/v1
kind: Deployment
metadata:
  name: seamlesswallet-deployment  
  labels:
    app: seamlesswallet
    ENV: PRD
spec:
  replicas: 4
  selector:
    matchLabels:
      app: seamlesswallet
  revisionHistoryLimit: 5  
  template:
    metadata:
      labels:
        app: seamlesswallet
        ENV: PRD
    spec:
      containers:
        - name: seamlesswallet
          image: harbor.ailabpte.co/integratedservice/thirdpartyseamlesswallet:e872bcc
          resources:
            requests:
              cpu: "1"
              memory: "3G"
            limits:
              cpu: "1"
              memory: "4G" 
          ports:
            - containerPort: 59259
          env:
            - name: ASPNETCORE_ENVIRONMENT
              value: Production
            - name: ServiceType
              value: API
            - name: Brand
              value: Nova
          volumeMounts:
            - name: seamlesswallet-pvc
              mountPath: /seamlesswallet
              subPath: logs/seamlesswallet
          livenessProbe:
            httpGet:
              path: /health
              port: 59259
          readinessProbe:
            httpGet:
              path: /health
              port: 59259
            initialDelaySeconds: 10    
      terminationGracePeriodSeconds: 30
      volumes:
        - name: seamlesswallet-pvc
          persistentVolumeClaim:
            claimName: seamlesswallet-pvc
      imagePullSecrets:
        - name: harbor-secret