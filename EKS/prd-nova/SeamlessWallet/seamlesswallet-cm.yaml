apiVersion: v1
kind: ConfigMap
metadata:
  name: seamlesswallet-configmap  
data:
  environment: Production  
  appsettings.Production: |
    {  
      "Serilog": {
        "Name": "ServiceFile",
        "MinimumLevel": {
          "Default": "Information",
          "Overwrite": {
            "Name": "Microsoft",
            "Level": "Error"
          }
        },
        "WriteTo": [
          {
            "Name": "Console",
            "Args": {
              "formatter": "Serilog.Formatting.Json.JsonFormatter, Serilog"
            }
          }
        ]
      },         
      "ConfigService": [ "http://configservice-service/SeamlessWallet" ] 
    }



