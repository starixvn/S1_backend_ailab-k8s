apiVersion: apps/v1
kind: Deployment
metadata:
  name: settleworker-deployment  
  labels:
    app: settleworker
    ENV: PRD
spec:
  replicas: 1
  selector:
    matchLabels:
      app: settleworker 
  revisionHistoryLimit: 5 
  template:
    metadata:
      labels:
        app: settleworker
        ENV: PRD
    spec:
      containers:
        - name: settleworker
          image: harbor.ailabpte.co/integratedservice/thirdpartysettleworker:e872bcc
          resources:
            requests:
              cpu: "2"
              memory: "4G"
            limits:
              cpu: "4"
              memory: "8G"
          env:
            - name: ASPNETCORE_ENVIRONMENT
              valueFrom:
                configMapKeyRef:
                  name: seamlesswallet-configmap
                  key: environment
            - name: ServiceType
              value: Worker
            - name: Brand
              value: Nova
          volumeMounts:
            - name: settleworker-appsettings
              mountPath: /app/appsettings.Production.json
              subPath: appsettings.Production.json
            - name: settleworker-pvc
              mountPath: /settleworker
              subPath: logs/settleworker
      volumes:
        - name: settleworker-appsettings
          configMap:
            name: seamlesswallet-configmap
            items:
              - key: appsettings.Production
                path: appsettings.Production.json
        - name: settleworker-pvc
          persistentVolumeClaim:
            claimName: settleworker-pvc
      imagePullSecrets:
        - name: harbor-secret
