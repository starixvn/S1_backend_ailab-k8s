apiVersion: apps/v1
kind: Deployment
metadata:
  name: reportservice-deployment
  labels:
    app: reportservice
    ENV: PRD
spec:
  replicas: 2
  selector:
    matchLabels:
      app: reportservice
  revisionHistoryLimit: 5
  template:
    metadata:
      labels:
        app: reportservice
        ENV: PRD
    spec:
      containers:
        - name: reportservice
          image: harbor.ailabpte.co/reportservice/reportservice:b5605b1
          resources:
            requests:
              cpu: "1"
              memory: "6G"
            limits:
              cpu: "2"
              memory: "8G"
          ports:
            - containerPort: 8418
          env:
            - name: ASPNETCORE_ENVIRONMENT
              value: Production
            - name: ServiceType
              value: API
            - name: Brand
              value: Nova
          volumeMounts:
            - name: reportservice-pvc
              mountPath: /report
              subPath: logs/reportservice
      volumes:     
        - name: reportservice-pvc
          persistentVolumeClaim:
            claimName: reportservice-pvc
      imagePullSecrets:
        - name: harbor-secret