apiVersion: apps/v1
kind: Deployment
metadata:
  name: tpwager-deployment  
  labels:
    app: tpwager
spec:
  replicas: 1
  selector:
    matchLabels:
      app: tpwager
  template:
    metadata:
      labels:
        app: tpwager
    spec:
      containers:
        - name: tpwager
          image: harbor.ailabpte.co/integratedservice/thirdpartywager:e7e16b4
          resources:
            requests:
              cpu: "2"
              memory: "4G"
            limits:
              cpu: "4"
              memory: "8G" 
          env:
            - name: ASPNETCORE_ENVIRONMENT
              valueFrom:
                configMapKeyRef:
                  name: tpwager-configmap
                  key: environment
            - name: ServiceType
              value: Worker
          volumeMounts:
            - name: tpwager-appsettings
              mountPath: /app/appsettings.Production.json
              subPath: appsettings.Production.json
      volumes:
        - name: tpwager-appsettings
          configMap:
            name: tpwager-configmap
            items:
              - key: appsettings.Production
                path: appsettings.Production.json
      imagePullSecrets:
        - name: harbor-secret
