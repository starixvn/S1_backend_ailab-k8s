apiVersion: apps/v1
kind: Deployment
metadata:
  name: tpwager-deployment  
  labels:
    app: tpwager
    ENV: PRD
spec:
  replicas: 1
  selector:
    matchLabels:
      app: tpwager
  revisionHistoryLimit: 5
  template:
    metadata:
      labels:
        app: tpwager
        ENV: PRD
    spec:
      containers:
        - name: tpwager
          image: harbor.ailabpte.co/integratedservice/thirdpartywager:0793efa
          resources:
            requests:
              cpu: "0.5"
              memory: "2G"
            limits:
              cpu: "1"
              memory: "2G" 
          env:
            - name: ASPNETCORE_ENVIRONMENT
              value: Production
            - name: ServiceType
              value: Worker
            - name: Brand
              value: Nova
          volumeMounts:
            - name: tpwager-pvc
              mountPath: /tpwager
              subPath: logs/tpwager
      volumes:
        - name: tpwager-pvc
          persistentVolumeClaim:
            claimName: tpwager-pvc
      imagePullSecrets:
        - name: harbor-secret
