apiVersion: apps/v1
kind: Deployment
metadata:
  name: tpwager-deployment  
  labels:
    app: tpwager
spec:
  replicas: 1
  selector:
    matchLabels:
      app: tpwager
  template:
    metadata:
      labels:
        app: tpwager
    spec:
      containers:
        - name: tpwager
          image: harbor.ailabpte.co/integratedservice/thirdpartywager:0793efa
          resources:
            requests:
              cpu: "0.5"
              memory: "2G"
            limits:
              cpu: "1"
              memory: "2G" 
          env:
            - name: ASPNETCORE_ENVIRONMENT
              valueFrom:
                configMapKeyRef:
                  name: tpwager-configmap
                  key: environment
            - name: ServiceType
              value: Worker
            - name: Brand
              value: Nova
          volumeMounts:
            - name: tpwager-appsettings
              mountPath: /app/appsettings.Production.json
              subPath: appsettings.Production.json
            - name: tpwager-pvc
              mountPath: /tpwager
              subPath: logs/tpwager
      volumes:
        - name: tpwager-appsettings
          configMap:
            name: tpwager-configmap
            items:
              - key: appsettings.Production
                path: appsettings.Production.json
        - name: tpwager-pvc
          persistentVolumeClaim:
            claimName: tpwager-pvc
      imagePullSecrets:
        - name: harbor-secret
