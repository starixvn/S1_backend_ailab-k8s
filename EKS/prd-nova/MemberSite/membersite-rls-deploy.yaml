apiVersion: apps/v1
kind: Deployment
metadata:
  name: membersite-rls-deployment  
  labels:
    app: membersite-rls
spec:
  replicas: 2
  selector:
    matchLabels:
      app: membersite-rls
  revisionHistoryLimit: 5
  template:
    metadata:
      labels:
        app: membersite-rls
    spec:
      containers:
        - name: membersite-rls
          image: harbor.ailabpte.co/membersite/membersite:065c17e
          resources:
            requests:
              cpu: "0.5"
              memory: "1G"
            limits:
              cpu: "1"
              memory: "2G"
          ports:
            - containerPort: 80
          env:
            - name: ASPNETCORE_ENVIRONMENT
              value: Release
            - name: ServiceType
              value: API
            - name: Brand
              value: Nova
          volumeMounts:
            - name: membersite-appsettings
              mountPath: /app/appsettings.Release.json
              subPath: appsettings.Production.json
            - name: membersite-rls-pvc
              mountPath: /membersite
              subPath: logs/membersite-rls
      volumes:
        - name: membersite-appsettings
          configMap:
            name: membersite-configmap
            items:
              - key: appsettings.Production
                path: appsettings.Production.json
        - name: membersite-rls-pvc
          persistentVolumeClaim:
            claimName: membersite-rls-pvc
      imagePullSecrets:
        - name: harbor-secret
