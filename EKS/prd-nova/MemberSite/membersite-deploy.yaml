apiVersion: apps/v1
kind: Deployment
metadata:
  name: membersite-deployment
  labels:
    app: membersite
    ENV: PRD
spec:
  replicas: 3
  selector:
    matchLabels:
      app: membersite
  revisionHistoryLimit: 5
  template:
    metadata:
      labels:
        app: membersite
        ENV: PRD
      annotations:
        prometheus.io/port: '80'
        prometheus.io/scrape: 'true'
    spec:
      containers:
        - name: membersite
          image: harbor.ailabpte.co/membersite/membersite:065c17e
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sh","-c","sleep 70"]
          resources:
            requests:
              cpu: "2"
              memory: "8G"
            limits:
              cpu: "4"
              memory: "16G"
          ports:
            - containerPort: 80
          env:
            - name: ASPNETCORE_ENVIRONMENT
              value: Production
            - name: ServiceType
              value: API
            - name: Brand
              value: Nova
          volumeMounts:
            - name: membersite-pvc
              mountPath: /membersite
              subPath: logs/membersite
      terminationGracePeriodSeconds: 90
      volumes:
        - name: membersite-pvc
          persistentVolumeClaim:
            claimName: membersite-pvc
      imagePullSecrets:
        - name: harbor-secret