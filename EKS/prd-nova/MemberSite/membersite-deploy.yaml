apiVersion: apps/v1
kind: Deployment
metadata:
  name: membersite-deployment
  labels:
    app: membersite
    ENV: PRD
spec:
  replicas: 3
  selector:
    matchLabels:
      app: membersite
  revisionHistoryLimit: 5
  template:
    metadata:
      labels:
        app: membersite
        ENV: PRD
    spec:
      containers:
        - name: membersite
          image: harbor.ailabpte.co/membersite/membersite:065c17e
          resources:
            requests:
              cpu: "1"
              memory: "5G"
            limits:
              cpu: "1"
              memory: "6G"
          ports:
            - containerPort: 80
          env:
            - name: ASPNETCORE_ENVIRONMENT
              valueFrom:
                configMapKeyRef:
                  name: membersite-configmap
                  key: environment
            - name: ServiceType
              value: API
            - name: Brand
              value: Nova
          volumeMounts:
            - name: membersite-appsettings
              mountPath: /app/appsettings.Production.json
              subPath: appsettings.Production.json
            - name: membersite-pvc
              mountPath: /membersite
              subPath: logs/membersite
          readinessProbe:
            httpGet:
              path: /health
              port: 80
            initialDelaySeconds: 15   
      volumes:
        - name: membersite-appsettings
          configMap:
            name: membersite-configmap
            items:
              - key: appsettings.Production
                path: appsettings.Production.json
        - name: membersite-pvc
          persistentVolumeClaim:
            claimName: membersite-pvc
      imagePullSecrets:
        - name: harbor-secret