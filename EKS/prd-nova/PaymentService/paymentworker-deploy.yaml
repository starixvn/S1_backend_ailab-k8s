apiVersion: apps/v1
kind: Deployment
metadata:
  name: paymentservice-worker-deployment  
  labels:
    app: paymentworker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: paymentworker  
  revisionHistoryLimit: 5
  template:
    metadata:
      labels:
        app: paymentworker
    spec:
      containers:
        - name: paymentworker
          image: harbor.ailabpte.co/paymentservice/paymentservice:564d54d 
          resources:
            requests:
              cpu: "0.5"
              memory: "1G"
            limits:
              cpu: "0.5"
              memory: "2G" 
          env:
            - name: ASPNETCORE_ENVIRONMENT
              valueFrom:
                configMapKeyRef:
                  name: paymentservice-configmap
                  key: environment
            - name: ServiceType
              value: Worker
            - name: Brand
              value: Nova
          volumeMounts:
            - name: paymentworker-appsettings
              mountPath: /app/appsettings.Production.json
              subPath: appsettings.Production.json
            - name: paymentservice-pvc
              mountPath: /payment
              subPath: logs/paymentWorker
      volumes:
        - name: paymentworker-appsettings
          configMap:
            name: paymentservice-configmap
            items:
              - key: appsettings.Production
                path: appsettings.Production.json
        - name: paymentservice-pvc
          persistentVolumeClaim:
            claimName: paymentservice-pvc
      imagePullSecrets:
        - name: harbor-secret