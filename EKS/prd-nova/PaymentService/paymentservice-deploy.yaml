apiVersion: apps/v1
kind: Deployment
metadata:
  name: paymentservice-deployment  
  labels:
    app: paymentservice
spec:
  replicas: 3
  selector:
    matchLabels:
      app: paymentservice  
  revisionHistoryLimit: 5
  template:
    metadata:
      labels:
        app: paymentservice
    spec:
      containers:
        - name: paymentservice
          image: harbor.ailabpte.co/paymentservice/paymentservice:564d54d
          resources:
            requests:
              cpu: "2"
              memory: "4G"
            limits:
              cpu: "4"
              memory: "8G" 
          ports:
            - containerPort: 59159
          env:
            - name: ASPNETCORE_ENVIRONMENT
              valueFrom:
                configMapKeyRef:
                  name: paymentservice-configmap
                  key: environment
            - name: ServiceType
              value: API
            - name: Brand
              value: Nova
          volumeMounts:
            - name: paymentservice-appsettings
              mountPath: /app/appsettings.Production.json
              subPath: appsettings.Production.json
            - name: paymentservice-pvc
              mountPath: /payment
              subPath: logs/payment
          livenessProbe:
            httpGet:
              path: /health
              port: 59159
      volumes:
        - name: paymentservice-appsettings
          configMap:
            name: paymentservice-configmap
            items:
              - key: appsettings.Production
                path: appsettings.Production.json
        - name: paymentservice-pvc
          persistentVolumeClaim:
            claimName: paymentservice-pvc
      imagePullSecrets:
        - name: harbor-secret