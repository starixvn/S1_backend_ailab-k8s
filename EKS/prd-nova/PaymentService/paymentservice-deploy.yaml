apiVersion: apps/v1
kind: Deployment
metadata:
  name: paymentservice-deployment  
  labels:
    app: paymentservice
    ENV: PRD
spec:
  replicas: 2
  selector:
    matchLabels:
      app: paymentservice  
  revisionHistoryLimit: 5
  template:
    metadata:
      labels:
        app: paymentservice
        ENV: PRD
    spec:
      containers:
        - name: paymentservice
          image: harbor.ailabpte.co/paymentservice/paymentservice:564d54d
          resources:
            requests:
              cpu: "0.5"
              memory: "1G"
            limits:
              cpu: "0.5"
              memory: "2G" 
          ports:
            - containerPort: 59159
          env:
            - name: ASPNETCORE_ENVIRONMENT
              value: Production
            - name: ServiceType
              value: API
            - name: Brand
              value: Nova
          volumeMounts:        
            - name: paymentservice-pvc
              mountPath: /payment
              subPath: logs/payment
          livenessProbe:
            httpGet:
              path: /health
              port: 59159
          readinessProbe:
            httpGet:
              path: /health
              port: 59159
            initialDelaySeconds: 10  
      volumes:     
        - name: paymentservice-pvc
          persistentVolumeClaim:
            claimName: paymentservice-pvc
      imagePullSecrets:
        - name: harbor-secret