apiVersion: apps/v1
kind: Deployment
metadata:
  name: storeservice-deployment  
  labels:
    app: storeservice
    ENV: PRD
spec:
  replicas: 1
  selector:
    matchLabels:
      app: storeservice
  revisionHistoryLimit: 5 
  template:
    metadata:
      labels:
        app: storeservice
        ENV: PRD
    spec:
      containers:
        - name: storeservice
          image: harbor.ailabpte.co/storeservice/storeservice:c305ec7
          resources:
            requests:
              cpu: "0.25"
              memory: "1G"
            limits:
              cpu: "0.25"
              memory: "2G" 
          ports:
            - containerPort: 51001
          env:
            - name: ASPNETCORE_ENVIRONMENT
              value: Production
            - name: ServiceType
              value: API
            - name: Brand
              value: Nova
          volumeMounts:
            - name: storeservice-pvc
              mountPath: /storeservice
              subPath: logs/storeservice
          livenessProbe:
            httpGet:
              path: /health
              port: 51001
          readinessProbe:
            httpGet:
              path: /health
              port: 51001
            initialDelaySeconds: 10  
      volumes:
        - name: storeservice-pvc
          persistentVolumeClaim:
            claimName: storeservice-pvc
      imagePullSecrets:
        - name: harbor-secret