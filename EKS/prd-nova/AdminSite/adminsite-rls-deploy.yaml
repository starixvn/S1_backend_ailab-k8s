apiVersion: apps/v1
kind: Deployment
metadata:
  name: adminsite-rls-deployment  
  labels:
    app: adminsite-rls
spec:
  replicas: 2
  selector:
    matchLabels:
      app: adminsite-rls
  revisionHistoryLimit: 5
  template:
    metadata:
      labels:
        app: adminsite-rls
    spec:
      containers:
        - name: adminsite-rls
          image: harbor.ailabpte.co/adminsite/backendsite:c55d831
          resources:
            requests:
              cpu: "2"
              memory: "4G"
            limits:
              cpu: "4"
              memory: "8G" 
          ports:
            - containerPort: 5070
          env:
            - name: ASPNETCORE_ENVIRONMENT
              value: Release
            - name: ServiceType
              value: API
            - name: Brand
              value: Nova
          volumeMounts:
            - name: adminsite-appsettings
              mountPath: /app/appsettings.Release.json
              subPath: appsettings.Production.json
            - name: adminsite-rls-pvc
              mountPath: /backendsite
              subPath: logs/backendsite-rls  
      volumes:
        - name: adminsite-appsettings
          configMap:
            name: adminsite-configmap
            items:
              - key: appsettings.Production
                path: appsettings.Production.json
        - name: adminsite-rls-pvc
          persistentVolumeClaim:
            claimName: adminsite-rls-pvc
      imagePullSecrets:
        - name: harbor-secret