apiVersion: apps/v1
kind: Deployment
metadata:
  name: adminsite-rls-deployment  
  labels:
    app: adminsite-rls
    ENV: PRD
spec:
  replicas: 1
  selector:
    matchLabels:
      app: adminsite-rls
  revisionHistoryLimit: 5
  template:
    metadata:
      labels:
        app: adminsite-rls
        ENV: PRD
      annotations:
        prometheus.io/port: '5070'
        prometheus.io/scrape: 'true'
    spec:
      containers:
        - name: adminsite-rls
          image: harbor.ailabpte.co/adminsite/backendsite:c55d831
          resources:
            requests:
              cpu: "0.25"
              memory: "0.5G"
            limits:
              cpu: "0.5"
              memory: "1G"
          ports:
            - containerPort: 5070
          env:
            - name: ASPNETCORE_ENVIRONMENT
              value: Release
            - name: ServiceType
              value: API
            - name: Brand
              value: Nova
          volumeMounts:            
            - name: adminsite-rls-pvc
              mountPath: /backendsite
              subPath: logs/backendsite-rls
          readinessProbe:
            httpGet:
              path: /health
              port: 5070
            initialDelaySeconds: 10
      volumes:      
        - name: adminsite-rls-pvc
          persistentVolumeClaim:
            claimName: adminsite-rls-pvc
      imagePullSecrets:
        - name: harbor-secret