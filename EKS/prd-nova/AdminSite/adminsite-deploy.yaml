apiVersion: apps/v1
kind: Deployment
metadata:
  name: adminsite-deployment
  labels:
    app: adminsite
    ENV: PRD
spec:
  replicas: 3
  selector:
    matchLabels:
      app: adminsite
  revisionHistoryLimit: 5
  template:
    metadata:
      labels:
        app: adminsite      
    spec:
      containers:
        - name: adminsite
          image: harbor.ailabpte.co/adminsite/backendsite:c55d831
          resources:
            requests:
              cpu: "0.5"
              memory: "3G"
            limits:
              cpu: "0.5"
              memory: "4G" 
          ports:
            - containerPort: 5070
          env:
            - name: ASPNETCORE_ENVIRONMENT
              valueFrom:
                configMapKeyRef:
                  name: adminsite-configmap
                  key: environment
            - name: ServiceType
              value: API
            - name: Brand
              value: Nova
          volumeMounts:
            - name: adminsite-appsettings
              mountPath: /app/appsettings.Production.json
              subPath: appsettings.Production.json
            - name: adminsite-pvc
              mountPath: /backendsite
              subPath: logs/backendsite
          readinessProbe:
            httpGet:
              path: /health
              port: 5070
            initialDelaySeconds: 10  
      volumes:
        - name: adminsite-appsettings
          configMap:
            name: adminsite-configmap
            items:
              - key: appsettings.Production
                path: appsettings.Production.json
        - name: adminsite-pvc
          persistentVolumeClaim:
            claimName: adminsite-pvc
      imagePullSecrets:
        - name: harbor-secret