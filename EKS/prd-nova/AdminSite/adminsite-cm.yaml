apiVersion: v1
kind: ConfigMap
metadata:
  name: adminsite-configmap  
data:
  environment: Production  
  appsettings.Production: |
    {     
      "Serilog": {
        "Name": "ServiceFile",
        "MinimumLevel": {
          "Default": "Information",
          "Overwrite": {
            "Name": "Microsoft",
            "Level": "Error"
          }
        },
        "WriteTo": [
          {
            "Name": "File",
            "Args": {
              "path": "/backendsite/backendsite-.log",
              "formatter": "Serilog.Formatting.Json.JsonFormatter, Serilog",
              "rollingInterval": "Day",
              "retainedFileCountLimit": 10,
              "fileSizeLimitBytes": 10485760,
              "rollOnFileSizeLimit": true
            }
          },
          {
            "Name": "Console"
          }
        ]
      },
      "ElasticApm": {
        "ServiceName": "BackendSite",
        "ServiceVersion": "v1.0",
        "Environment": "Production",
        "LogLevel": "Info",
        "ServerUrl": "http://54.151.226.243:8200",
        "TransactionIgnoreUrls": "/health",
        "TransactionSampleRate": 1.0,
        "MaxBatchEventCount": 10
        },	       
      "ConfigService": [ "http://configservice-service/AdminSite" ] 
    }