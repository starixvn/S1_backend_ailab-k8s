apiVersion: v1
kind: ConfigMap
metadata:
  name: membersiteapp-configmap
data:
  environment: Production.APP
  appsettings.Production.APP: |
    {     
      "Serilog": {
        "Name": "ServiceFile",
        "MinimumLevel": {
          "Default": "Information",
          "Overwrite": {
            "Name": "Microsoft",
            "Level": "Error"
          }
        },
        "WriteTo": [
          {
            "Name": "Console",
            "Args": {
              "formatter": "Serilog.Formatting.Json.JsonFormatter, Serilog"
            }
          }
        ]
      }, 
      "ConfigService": [ "http://configservice-service/MemberSite" ] 
    }