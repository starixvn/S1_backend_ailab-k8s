apiVersion: apps/v1
kind: Deployment
metadata:
  name: membersite-app-deployment
  labels:
    app: membersite-app
    ENV: PRD
spec:
  replicas: 2
  selector:
    matchLabels:
      app: membersite-app
  revisionHistoryLimit: 5
  template:
    metadata:
      labels:
        app: membersite-app
        ENV: PRD
      annotations:
        prometheus.io/port: '80'
        prometheus.io/scrape: 'true'
    spec:
      containers:
        - name: membersite-app
          image: harbor.ailabpte.co/membersite/membersite:065c17e
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sh","-c","sleep 70"]
          resources:
            requests:
              cpu: "8"
              memory: "16G"
            limits:
              cpu: "16"
              memory: "32G"
          ports:
            - containerPort: 80
          env:
            - name: ASPNETCORE_ENVIRONMENT
              valueFrom:
                configMapKeyRef:
                  name: membersiteapp-configmap
                  key: environment
            - name: ServiceType
              value: API
            - name: Brand
              value: Nova
          volumeMounts:
            - name: membersiteapp-appsettings
              mountPath: /app/appsettings.Production.APP.json
              subPath: appsettings.Production.APP.json
            - name: membersite-pvc
              mountPath: /membersite
              subPath: logs/membersiteApp
          readinessProbe:
            httpGet:
              path: /health
              port: 80
            initialDelaySeconds: 15
      terminationGracePeriodSeconds: 90
      volumes:
        - name: membersiteapp-appsettings
          configMap:
            name: membersiteapp-configmap
            items:
              - key: appsettings.Production.APP
                path: appsettings.Production.APP.json
        - name: membersite-pvc
          persistentVolumeClaim:
            claimName: membersite-pvc
      imagePullSecrets:
        - name: harbor-secret