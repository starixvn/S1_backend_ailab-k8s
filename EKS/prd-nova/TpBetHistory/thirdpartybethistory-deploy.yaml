apiVersion: apps/v1
kind: Deployment
metadata:
  name: thirdpartybethistory-deployment  
  labels:
    app: thirdpartybethistory
    ENV: PRD
spec:
  replicas: 1
  selector:
    matchLabels:
      app: thirdpartybethistory
  revisionHistoryLimit: 5
  template:
    metadata:
      labels:
        app: thirdpartybethistory
        ENV: PRD
    spec:
      containers:
        - name: thirdpartybethistory
          image: harbor.ailabpte.co/integratedservice/thirdpartybethistory:e872bcc
          resources:
            requests:
              cpu: "2"
              memory: "4G"
            limits:
              cpu: "4"
              memory: "8G"           
          env:
            - name: ASPNETCORE_ENVIRONMENT
              value: Production
            - name: ServiceType
              value: Worker
            - name: Brand
              value: Nova
          volumeMounts:
            - name: thirdpartybethistory-pvc
              mountPath: /bethistory
              subPath: logs/bethistory
      volumes:
        - name: thirdpartybethistory-pvc
          persistentVolumeClaim:
            claimName: thirdpartybethistory-pvc
      imagePullSecrets:
        - name: harbor-secret
