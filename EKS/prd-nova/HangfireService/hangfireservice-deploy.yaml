apiVersion: apps/v1
kind: Deployment
metadata:
  name: hangfireservice-deployment  
  labels:
    app: hangfireservice
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hangfireservice
  template:
    metadata:
      labels:
        app: hangfireservice
    spec:
      containers:
        - name: hangfireservice
          image: harbor.ailabpte.co/hangfireservice/hangfireservice:474e031 
          resources:
            requests:
              cpu: "1"
              memory: "2G"
            limits:
              cpu: "2"
              memory: "4G"
          ports:
            - containerPort: 45678
          env:
            - name: ASPNETCORE_ENVIRONMENT
              valueFrom:
                configMapKeyRef:
                  name: hangfireservice-configmap
                  key: environment
            - name: Worker
              value: API
            - name: Brand
              value: Nova
          volumeMounts:
            - name: hangfireservice-appsettings
              mountPath: /app/appsettings.Production.json
              subPath: appsettings.Production.json
            - name: hangfireservice-pvc
              mountPath: /hangfire
              subPath: logs/hangfire
          livenessProbe:
            httpGet:
              path: /health
              port: 45678
      volumes:
        - name: hangfireservice-appsettings
          configMap:
            name: hangfireservice-configmap
            items:
              - key: appsettings.Production
                path: appsettings.Production.json
        - name: hangfireservice-pvc
          persistentVolumeClaim:
            claimName: hangfireservice-pvc
      imagePullSecrets:
        - name: harbor-secret
