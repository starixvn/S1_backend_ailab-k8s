apiVersion: apps/v1
kind: Deployment
metadata:
  name: hangfireservice-deployment  
  labels:
    app: hangfireservice
    ENV: PRD
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hangfireservice
  revisionHistoryLimit: 5
  template:
    metadata:
      labels:
        app: hangfireservice
        ENV: PRD
    spec:
      containers:
        - name: hangfireservice
          image: harbor.ailabpte.co/hangfireservice/hangfireservice:474e031 
          resources:
            requests:
              cpu: "2"
              memory: "4G"
            limits:
              cpu: "4"
              memory: "8G"
          ports:
            - containerPort: 45678
          env:
            - name: ASPNETCORE_ENVIRONMENT
              value: Production
            - name: Worker
              value: API
            - name: Brand
              value: Nova
          volumeMounts:
            - name: hangfireservice-pvc
              mountPath: /hangfire
              subPath: logs/hangfire
          livenessProbe:
            httpGet:
              path: /health
              port: 45678
            timeoutSeconds: 5
      volumes:
        - name: hangfireservice-pvc
          persistentVolumeClaim:
            claimName: hangfireservice-pvc
      imagePullSecrets:
        - name: harbor-secret
