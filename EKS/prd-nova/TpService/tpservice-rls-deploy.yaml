apiVersion: apps/v1
kind: Deployment
metadata:
  name: tpservice-rls-deployment  
  labels:
    app: tpservice-rls
    ENV: PRD
spec:
  replicas: 1
  selector:
    matchLabels:
      app: tpservice-rls
  template:
    metadata:
      labels:
        app: tpservice-rls
        ENV: PRD
    spec:
      containers:
        - name: tpservice-rls
          image: harbor.ailabpte.co/integratedservice/thirdpartyservice:e3e6b1d
          resources:
            requests:
              cpu: "0.25"
              memory: "0.5G"
            limits:
              cpu: "0.25"
              memory: "1G"  
          ports:
            - containerPort: 55996
          env:
            - name: ASPNETCORE_ENVIRONMENT
              value: Release
            - name: ServiceType
              value: API
            - name: Brand
              value: Nova
          volumeMounts:
            - name: tpservice-appsettings
              mountPath: /app/appsettings.Release.json
              subPath: appsettings.Production.json
            - name: tpservice-rls-pvc
              mountPath: /tpservice
              subPath: logs/tpservice-rls
          livenessProbe:
            httpGet:
              path: /health
              port: 55996
          readinessProbe:
            httpGet:
              path: /health
              port: 55996
            initialDelaySeconds: 10 
      volumes:
        - name: tpservice-appsettings
          configMap:
            name: tpservice-configmap
            items:
              - key: appsettings.Production
                path: appsettings.Production.json
        - name: tpservice-rls-pvc
          persistentVolumeClaim:
            claimName: tpservice-rls-pvc
      imagePullSecrets:
        - name: harbor-secret
