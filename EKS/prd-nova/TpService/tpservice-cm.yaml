apiVersion: v1
kind: ConfigMap
metadata:
  name: tpservice-configmap
data:
  environment: Production
  appsettings.Production: |
    {     
      "Serilog": {
        "Name": "ServiceFile",
        "MinimumLevel": {
          "Default": "Information",
          "Overwrite": {
            "Name": "Microsoft",
            "Level": "Error"
          }
        },
        "WriteTo": [
          {
            "Name": "Console",
            "Args": {
              "formatter": "Serilog.Formatting.Json.JsonFormatter, Serilog"
            }
          }
        ]
      }, 
      "ElasticApm": {
        "ServiceName": "TpService",
        "ServiceVersion": "v1.0",
        "Environment": "Production",
        "LogLevel": "Info",
        "ServerUrl": "http://54.151.226.243:8200",
        "TransactionIgnoreUrls": "/health",
        "TransactionSampleRate": 1.0,
        "MaxBatchEventCount": 10
        },	      
      "ConfigService": [ "http://configservice-service/TpService" ] 
    }