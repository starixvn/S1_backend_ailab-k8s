apiVersion: apps/v1
kind: Deployment
metadata:
  name: tpservice-deployment  
  labels:
    app: tpservice
    ENV: PRD
spec:
  replicas: 2
  selector:
    matchLabels:
      app: tpservice
  revisionHistoryLimit: 5
  template:
    metadata:
      labels:
        app: tpservice
        ENV: PRD
    spec:
      containers:
        - name: tpservice
          image: harbor.ailabpte.co/integratedservice/thirdpartyservice:e872bcc
          resources:
            requests:
              cpu: "1"
              memory: "4G"
            limits:
              cpu: "2"
              memory: "8G"  
          ports:
            - containerPort: 55996
          env:
            - name: ASPNETCORE_ENVIRONMENT
              value: Production
            - name: ServiceType
              value: API
            - name: Brand
              value: Nova
          volumeMounts:
            - name: tpservice-pvc
              mountPath: /tpservice
              subPath: logs/tpservice
          livenessProbe:
            httpGet:
              path: /health
              port: 55996
          readinessProbe:
            httpGet:
              path: /health
              port: 55996
            initialDelaySeconds: 10 
      volumes:
        - name: tpservice-pvc
          persistentVolumeClaim:
            claimName: tpservice-pvc
      imagePullSecrets:
        - name: harbor-secret
