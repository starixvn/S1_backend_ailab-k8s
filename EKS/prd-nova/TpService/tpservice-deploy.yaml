apiVersion: apps/v1
kind: Deployment
metadata:
  name: tpservice-deployment  
  labels:
    app: tpservice
    ENV: PRD
spec:
  replicas: 2
  selector:
    matchLabels:
      app: tpservice  
  template:
    metadata:
      labels:
        app: tpservice
        ENV: PRD
    spec:
      containers:
        - name: tpservice
          image: harbor.ailabpte.co/integratedservice/thirdpartyservice:e872bcc
          resources:
            requests:
              cpu: "0.5"
              memory: "1G"
            limits:
              cpu: "0.5"
              memory: "2G"  
          ports:
            - containerPort: 55996
          env:
            - name: ASPNETCORE_ENVIRONMENT
              valueFrom:
                configMapKeyRef:
                  name: tpservice-configmap
                  key: environment
            - name: ServiceType
              value: API
            - name: Brand
              value: Nova
          volumeMounts:
            - name: tpservice-appsettings
              mountPath: /app/appsettings.Production.json
              subPath: appsettings.Production.json
            - name: tpservice-pvc
              mountPath: /tpservice
              subPath: logs/tpservice
          livenessProbe:
            httpGet:
              path: /health
              port: 55996
          readinessProbe:
            httpGet:
              path: /health
              port: 55996
            initialDelaySeconds: 10 
      volumes:
        - name: tpservice-appsettings
          configMap:
            name: tpservice-configmap
            items:
              - key: appsettings.Production
                path: appsettings.Production.json
        - name: tpservice-pvc
          persistentVolumeClaim:
            claimName: tpservice-pvc
      imagePullSecrets:
        - name: harbor-secret
