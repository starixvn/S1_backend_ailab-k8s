apiVersion: apps/v1
kind: Deployment
metadata:
  name: storehangfireservice-deployment
  labels:
    app: storehangfireservice
spec:
  replicas: 1
  selector:
    matchLabels:
      app: storehangfireservice
  template:
    metadata:
      labels:
        app: storehangfireservice
    spec:
      containers:
        - name: storehangfireservice
          image: harbor.ailabpte.co/storeservice/storehangfireservice:c305ec7
          resources:
            requests:
              cpu: "0.25"
              memory: "1G"
            limits:
              cpu: "0.25"
              memory: "2G" 
          ports:
            - containerPort: 51003
          env:
            - name: ASPNETCORE_ENVIRONMENT
              valueFrom:
                configMapKeyRef:
                  name: storehangfireservice-configmap
                  key: environment
            - name: Worker
              value: API
            - name: Brand
              value: Nova
          volumeMounts:
            - name: storehangfireservice-appsettings
              mountPath: /app/appsettings.Production.json
              subPath: appsettings.Production.json
            - name: storehangfireservice-pvc
              mountPath: /storeworker
              subPath: logs/storeworker
          livenessProbe:
            httpGet:
              path: /health
              port: 51003
      volumes:
        - name: storehangfireservice-appsettings
          configMap:
            name: storehangfireservice-configmap
            items:
              - key: appsettings.Production
                path: appsettings.Production.json
        - name: storehangfireservice-pvc
          persistentVolumeClaim:
            claimName: storehangfireservice-pvc
      imagePullSecrets:
        - name: harbor-secret
