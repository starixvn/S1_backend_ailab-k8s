apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: prd-seamlesswallet-ingress
  annotations:
    kubernetes.io/ingress.class: alb
    alb.ingress.kubernetes.io/load-balancer-name: prd-seamlesswallet-ingress
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTPS":443}]'
    alb.ingress.kubernetes.io/certificate-arn: 'arn:aws:acm:ap-southeast-1:761771912479:certificate/e6ec6644-716a-472a-b8c6-a2388d6d3b5c'
    alb.ingress.kubernetes.io/wafv2-acl-arn: arn:aws:wafv2:ap-southeast-1:761771912479:regional/webacl/TP_Nova_AccessRule_PRD/9cb06687-2f77-4268-b970-87b48889ef19
    alb.ingress.kubernetes.io/subnets: subnet-045d980c50e6dc7b4,subnet-056fe0386b9b46a40,subnet-0bcd9c088afc673e6
    alb.ingress.kubernetes.io/healthcheck-path: /health
spec:
  ingressClassName: alb
  rules:
  # Noc
    - host: "tp.nova88.net"
      http:
        paths:
        - path: /
          pathType: Prefix
          backend:
            service:
              name: seamlesswallet-service
              port:
                number: 443
    - host: "tp.nova88asia.com"
      http:
        paths:
        - path: /
          pathType: Prefix
          backend:
            service:
              name: seamlesswallet-service
              port:
                number: 443
    # Route53
    - host: "tp.ailab88.net"
      http:
        paths:
        - path: /
          pathType: Prefix
          backend:
            service:
              name: seamlesswallet-service
              port:
                number: 443
    - host: "tp.ailab168.net"
      http:
        paths:
        - path: /
          pathType: Prefix
          backend:
            service:
              name: seamlesswallet-service
              port:
                number: 443