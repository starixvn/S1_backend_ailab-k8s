apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: prd-backend-internal-ingress
  annotations:
    kubernetes.io/ingress.class: alb
    alb.ingress.kubernetes.io/load-balancer-name: prd-backend-internal-ingress
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip    
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP":80}, {"HTTPS":443}]' 
    alb.ingress.kubernetes.io/certificate-arn: 'arn:aws:acm:ap-southeast-1:761771912479:certificate/bcf1a51a-ff64-495a-84f0-e2b5ab93a01f'
    alb.ingress.kubernetes.io/subnets: subnet-0304543452f554e20,subnet-0304b609c266c4b60,subnet-0e3eaf19af3b27b05    
spec:
  ingressClassName: alb
  rules:
  - host: membersiteservice.ailab88.net
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: membersite-service
            port:
              number: 80
  - host: storehangfireservice.ailab88.net
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: storehangfireservice-service
            port:
              number: 80