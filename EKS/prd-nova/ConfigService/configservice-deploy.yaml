apiVersion: apps/v1
kind: Deployment
metadata:
  name: configservice-deployment
  labels:
    app: configservice
spec:
  replicas: 2
  selector:
    matchLabels:
      app: configservice
  template:
    metadata:
      labels:
        app: configservice
    spec:
      containers:
        - name: configservice
          image: harbor.ailabpte.co/configservice/configservice:4d8f864
          resources:
            requests:
              cpu: "2"
              memory: "4G"
            limits:
              cpu: "4"
              memory: "8G" 
          ports:
            - containerPort: 7242
          env:
            - name: ASPNETCORE_ENVIRONMENT
              value: "Production"
            - name: ServiceType
              value: API
          livenessProbe:
            httpGet:
              path: /health
              port: 7242
      imagePullSecrets:
        - name: harbor-secret

