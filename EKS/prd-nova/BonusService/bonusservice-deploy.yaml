apiVersion: apps/v1
kind: Deployment
metadata:
  name: bonusservice-deployment  
  labels:
    app: bonusservice
    ENV: PRD
spec:
  replicas: 2
  selector:
    matchLabels:
      app: bonusservice
  revisionHistoryLimit: 5
  template:
    metadata:
      labels:
        app: bonusservice
        ENV: PRD
    spec:
      containers:
        - name: bonusservice
          image: harbor.ailabpte.co/bonusservice/bonusservice:f8eb6aa
          resources:
            requests:
              cpu: "1"
              memory: "6G"
            limits:
              cpu: "2"
              memory: "12G"
          ports:
            - containerPort: 50997
          env:
            - name: ASPNETCORE_ENVIRONMENT
              value: Production
            - name: ServiceType
              value: API
            - name: Brand
              value: Nova
          volumeMounts:
            - name: bonusservice-pvc
              mountPath: /bonus
              subPath: logs/bonus 
          livenessProbe:
            httpGet:
              path: /health
              port: 50997
          readinessProbe:
            httpGet:
              path: /health
              port: 50997
            initialDelaySeconds: 10 
      volumes:      
        - name: bonusservice-pvc
          persistentVolumeClaim:
            claimName: bonusservice-pvc
      imagePullSecrets:
        - name: harbor-secret