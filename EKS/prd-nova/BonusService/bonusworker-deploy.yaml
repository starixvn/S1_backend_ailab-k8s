apiVersion: apps/v1
kind: Deployment
metadata:
  name: bonusservice-worker-deployment  
  labels:
    app: bonusworker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: bonusworker  
  template:
    metadata:
      labels:
        app: bonusworker
    spec:
      containers:
        - name: bonusworker
          image: harbor.ailabpte.co/bonusservice/bonusservice:f8eb6aa
          resources:
            requests:
              cpu: "2"
              memory: "4G"
            limits:
              cpu: "4"
              memory: "8G"
          env:
            - name: ASPNETCORE_ENVIRONMENT
              valueFrom:
                configMapKeyRef:
                  name: bonusservice-configmap
                  key: environment
            - name: ServiceType
              value: Worker
            - name: Brand
              value: Nova
          volumeMounts:
            - name: bonusservice-appsettings
              mountPath: /app/appsettings.Production.json
              subPath: appsettings.Production.json
            - name: bonusservice-pvc
              mountPath: /bonus
              subPath: logs/bonusWorker
      volumes:
        - name: bonusservice-appsettings
          configMap:
            name: bonusservice-configmap
            items:
              - key: appsettings.Production
                path: appsettings.Production.json
        - name: bonusservice-pvc
          persistentVolumeClaim:
            claimName: bonusservice-pvc
      imagePullSecrets:
        - name: harbor-secret